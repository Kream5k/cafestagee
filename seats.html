
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Table | Cafestage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cafestage</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="visit.html">Visit</a>
            <a href="menu.html">Menu</a>
        </nav>
    </header>

    <main class="seats-section">

        <h2>Choose Your Spot</h2>
        <p>Every table has its own little story. Where would you like to sit?</p>

        <div class="table-grid">

            <div class="table-card">
                <img src="images/sua.png" alt="Sua's table">
                <h3>Table 1 — Sua</h3>
                <button onclick="selectTable('Table 1 — Sua')">
                    Choose Table
                </button>
            </div>

            <div class="table-card">
                <img src="images/mizi.png" alt="Mizi's table">
                <h3>Table 2 — Mizi</h3>
                <button onclick="selectTable('Table 2 — Mizi')">
                    Choose Table
                </button>
            </div>

            <div class="table-card">
                <img src="images/ivan.png" alt="Ivan's table">
                <h3>Table 3 — Ivan</h3>
                <button onclick="selectTable('Table 3 — Ivan')">
                    Choose Table
                </button>
            </div>

            <div class="table-card">
                <img src="images/till.png" alt="Till's table">
                <h3>Table 4 — Till</h3>
                <button onclick="selectTable('Table 4 — Till')">
                    Choose Table
                </button>
            </div>

        </div>

        <div id="selected-table"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
