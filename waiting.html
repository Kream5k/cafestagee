
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While You Wait | Cafestage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cafestage</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
        </nav>
    </header>

    <main class="waiting-section">

        <h2>Your order is being prepared!</h2>

        <p class="waiting-description">
            Sit back, relax, and enjoy a little game while our
            team prepares your treats.
        </p>

        <div class="timer-card">
            <p>Estimated preparation time</p>
            <h2 id="countdown">00:00</h2>
            <p id="timer-message">Your order is on its way!</p>
        </div>

        <section class="trivia-card">

            <h2>✦ Cafestage Trivia ✦</h2>

            <p>Test your knowledge while you wait!</p>

            <p id="score">Score: 0</p>

            <button id="start-trivia" onclick="startTrivia()">
                Play Trivia
            </button>

            <div id="trivia-area"></div>

        </section>

        <div id="ready-area"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
